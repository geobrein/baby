name: Winkels onderzoeken

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Alleen deze winkels (komma-gescheiden, leeg = alle)'
        required: false
        default: ''
      url:
        description: 'Extra productpagina om te controleren (volledige URL)'
        required: false
        default: ''
      links:
        description: 'Pagina waarvan de links getoond moeten worden (bijv. een homepage)'
        required: false
        default: ''
      match:
        description: 'Toon alleen links die dit woord bevatten (standaard: luier)'
        required: false
        default: 'luier'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Winkels onderzoeken
        run: |
          args=""
          [ -n "${{ inputs.only }}" ] && args="$args --only=${{ inputs.only }}"
          [ -n "${{ inputs.url }}" ] && args="$args --url=${{ inputs.url }}"
          [ -n "${{ inputs.links }}" ] && args="$args --links=${{ inputs.links }} --match=${{ inputs.match }}"
          node scripts/probe-shops.mjs $args | tee -a "$GITHUB_STEP_SUMMARY"
