name: Prijzen bijwerken

on:
  schedule:
    # 05:15 UTC = 07:15 (zomertijd) / 06:15 (wintertijd) in Nederland.
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Alleen deze winkels (komma-gescheiden, leeg = alle)'
        required: false
        default: ''
      limit:
        description: 'Maximaal zoveel producten (leeg = alle)'
        required: false
        default: ''
      dry_run:
        description: 'Alleen kijken wat er gevonden wordt, niets wegschrijven'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: prijzen-bijwerken
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prijzen ophalen
        run: |
          # Het tijdbudget ligt onder de timeout van de job, zodat er altijd
          # resultaat weggeschreven en gecommit wordt.
          args="--budget=30"
          [ -n "${{ inputs.only }}" ] && args="$args --only=${{ inputs.only }}"
          [ -n "${{ inputs.limit }}" ] && args="$args --limit=${{ inputs.limit }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          echo "node scripts/fetch-prices.mjs $args"
          node scripts/fetch-prices.mjs $args

      - name: Samenvatting
        if: always()
        run: node scripts/summary.mjs

      - name: Wijzigingen vastleggen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/prices.json data/resolved.json data/history.json data/identity.json data/report.json
          if git diff --staged --quiet; then
            echo 'Geen prijswijzigingen.'
          else
            git commit -m "Prijzen bijgewerkt ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
